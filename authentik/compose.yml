services:
  server:
    command: server
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${PG_HOST:?database host required}
      AUTHENTIK_POSTGRESQL__DIRECT__HOST: ${PG_DIRECT_HOST:?database direct host required}
      AUTHENTIK_POSTGRESQL__PORT: ${PG_PORT:-5432}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__SSLMODE: ${PG_SSLMODE:-require}
      AUTHENTIK_POSTGRESQL__CONN_MAX_AGE: "0"
      AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS: "true"
      AUTHENTIK_SKIP_MIGRATIONS: ${AUTHENTIK_SKIP_MIGRATIONS:-true}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.5}
    ports:
      - ${COMPOSE_PORT_HTTP:-9000}:9000
      - ${COMPOSE_PORT_HTTPS:-9443}:9443
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ./data:/data
      - ./custom-templates:/templates

  worker:
    command: worker
    env_file:
      - .env
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${PG_HOST:?database host required}
      AUTHENTIK_POSTGRESQL__DIRECT__HOST: ${PG_DIRECT_HOST:?database direct host required}
      AUTHENTIK_POSTGRESQL__PORT: ${PG_PORT:-5432}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__SSLMODE: ${PG_SSLMODE:-require}
      AUTHENTIK_POSTGRESQL__CONN_MAX_AGE: "0"
      AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS: "true"
      AUTHENTIK_SKIP_MIGRATIONS: ${AUTHENTIK_SKIP_MIGRATIONS:-true}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.5}
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      - ./certs:/certs
      - ./custom-templates:/templates
