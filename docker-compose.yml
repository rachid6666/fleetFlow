services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED:?DATABASE_URL_UNPOOLED is required}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-development-secret-change-me}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:-http://localhost:9000/application/o/fleetflow/}
      AUTHENTIK_ID: ${AUTHENTIK_ID:-local-authentik-client}
      AUTHENTIK_SECRET: ${AUTHENTIK_SECRET:-local-authentik-secret}
      AUTHENTIK_AUTHORIZATION_URL: ${AUTHENTIK_AUTHORIZATION_URL:-}
      SUPERSET_SERVER_URL: http://superset:8088
      SUPERSET_PUBLIC_URL: http://localhost:8088
      AUTHENTIK_ADMIN_GROUP: ${AUTHENTIK_ADMIN_GROUP:-FleetFlow Admins}
      AUTHENTIK_SALES_GROUP: ${AUTHENTIK_SALES_GROUP:-FleetFlow Sales}
      AUTHENTIK_DRIVER_GROUP: ${AUTHENTIK_DRIVER_GROUP:-FleetFlow Drivers}
      AUTHENTIK_CUSTOMER_GROUP: ${AUTHENTIK_CUSTOMER_GROUP:-FleetFlow Customers}
      FLEETFLOW_API_URL: ${FLEETFLOW_API_URL:-http://app:3000}
      FLEETFLOW_HANDOVER_WEBHOOK_URL: ${FLEETFLOW_HANDOVER_WEBHOOK_URL:-http://n8n:5678/webhook/fleetflow/shipment-handover}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-local-n8n-webhook-secret}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-gemma4:12b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      n8n:
        condition: service_healthy
    networks:
      - fleetflow
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-n8n-encryption-key-change-me}
      FLEETFLOW_API_URL: ${FLEETFLOW_API_URL:-http://app:3000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-local-n8n-webhook-secret}
      TEAM_NOTIFICATION_WEBHOOK_URL: ${TEAM_NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - fleetflow-n8n:/home/node/.n8n
    networks:
      - fleetflow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5678/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  fleetflow-n8n:
networks:
  fleetflow:
    name: fleetflow
