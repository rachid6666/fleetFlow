name: fleetflow-analytics
services:
  superset:
    build: .
    ports:
      - "127.0.0.1:8088:8088"
    env_file: .env
    environment:
      SUPERSET_CONFIG_PATH: /app/fleetflow/superset_config.py
    volumes:
      - .:/app/fleetflow:ro
      - metadata:/app/superset_home
    networks:
      - fleetflow
    command: ["/bin/sh", "-c", "superset db upgrade && superset init && python /app/fleetflow/bootstrap.py && gunicorn --bind 0.0.0.0:8088 --workers 2 --timeout 120 'superset.app:create_app()'"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  metadata:

networks:
  fleetflow:
    name: fleetflow
    external: true
